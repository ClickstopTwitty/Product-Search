<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Part Finder</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#14181f;--muted:#5d6675;--line:#dde1e8;--accent:#0b5fff;--on:#fff;--good:#0a7d3c;--warn:#a65a00;--bad:#b3261e;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#101318;--card:#1a1f27;--text:#e9edf3;--muted:#98a2b3;--line:#2c3440;--accent:#5b8dff;--on:#0b0f16;--good:#4cc283;--warn:#f0a94a;--bad:#ff7b72;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--muted);font-size:14px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button,.btn{appearance:none;border:0;border-radius:10px;background:var(--accent);color:var(--on);font:inherit;font-weight:600;padding:12px 16px;width:100%;cursor:pointer;display:block;text-align:center}
.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}button:disabled{opacity:.5}
input[type=file]{display:none}input[type=password]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-bottom:8px}
#preview{width:100%;max-height:260px;object-fit:contain;border-radius:10px;margin-bottom:10px}.hidden{display:none}
.status{font-size:14px;color:var(--muted);margin:8px 0 0}.err{color:var(--bad);font-size:14px;margin-top:8px}
.result{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.result.top{border:2px solid var(--accent)}
.pn{font:700 22px/1.2 ui-monospace,Menlo,Consolas,monospace;word-break:break-all}.title{margin:4px 0;font-size:15px}.meta{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid currentColor;margin:0 6px 6px 0}
.high{color:var(--good)}.medium{color:var(--warn)}.low{color:var(--bad)}.exact{color:var(--good)}.similar{color:var(--muted)}
.confirm{margin-top:6px;font-size:14px;color:var(--warn)}.row{display:flex;gap:8px;margin-top:10px}.row>*{padding:9px 12px;font-size:14px}
a.btn{text-decoration:none}
</style></head><body><main>
<h1>Part Finder</h1><p class="sub">Snap a photo, get the part number from our sites.</p>
<div class="card hidden" id="pwCard"><input type="password" id="pw" placeholder="Team password" autocomplete="current-password"></div>
<div class="card">
  <img id="preview" class="hidden" alt="Product photo">
  <label class="btn" for="photo" id="photoBtn">Take or choose photo</label>
  <input type="file" id="photo" accept="image/*" capture="environment">
  <button id="go" class="hidden" style="margin-top:10px">Find part number</button>
  <p class="status" id="status"></p>
</div>
<div id="out"></div>
<script>
var blob=null,$=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
try{var saved=sessionStorage.getItem("pw");if(saved)$("pw").value=saved}catch(e){}
function shrink(f){return new Promise(function(res,rej){var i=new Image(),u=URL.createObjectURL(f);i.onload=function(){var s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(function(b){URL.revokeObjectURL(u);b?res(b):rej()},"image/jpeg",.85)};i.onerror=rej;i.src=u})}
function b64(b){return new Promise(function(r){var f=new FileReader();f.onload=function(){r(String(f.result).split(",")[1])};f.readAsDataURL(b)})}
$("photo").onchange=function(e){var f=e.target.files[0];if(!f)return;shrink(f).then(function(b){blob=b;var p=$("preview");p.src=URL.createObjectURL(b);p.classList.remove("hidden");$("go").classList.remove("hidden");$("photoBtn").textContent="Retake photo";$("out").innerHTML="";$("status").textContent=""}).catch(function(){$("status").textContent="Couldn’t read that image."})};
$("go").onclick=async function(){
  $("go").disabled=true;$("out").innerHTML="";$("status").textContent="Searching our sites… this can take 10–30 seconds.";
  try{
    var pw=$("pw").value;try{sessionStorage.setItem("pw",pw)}catch(e){}
    var r=await fetch("/api/identify",{method:"POST",headers:{"Content-Type":"application/json","x-app-password":pw},body:JSON.stringify({image:await b64(blob),mediaType:"image/jpeg"})});
    if(r.status===401){$("pwCard").classList.remove("hidden");throw new Error("Enter the team password above.")}
    if(!r.ok)throw new Error("Search failed. Try again.");
    render(await r.json());$("status").textContent="";
  }catch(e){$("status").textContent="";$("out").innerHTML='<div class="err">'+esc(e.message||"Something went wrong.")+'</div>'}
  $("go").disabled=false};
function render(d){
  var h='';
  if(!d.matches||!d.matches.length){h='<div class="card"><b>No confident match.</b><p class="meta">Try a photo showing any label or stamping.</p></div>'}
  else{h='<div class="card"><b>Matches</b>';d.matches.forEach(function(m,i){
    h+='<div class="result'+(i?'':' top')+'"><span class="tag '+esc(m.match)+'">'+esc((m.match||"similar").toUpperCase())+'</span><span class="tag '+esc(m.confidence)+'">'+esc((m.confidence||"low").toUpperCase())+'</span>'+
    '<div class="pn">'+esc(m.part_number)+'</div><div class="title">'+esc(m.title)+'</div><div class="meta">'+esc(m.reason)+'</div>'+
    (m.confirm?'<div class="confirm">Check: '+esc(m.confirm)+'</div>':'')+
    '<div class="row"><button class="sec copy" data-pn="'+esc(m.part_number)+'">Copy part #</button><a class="btn sec" href="'+esc(m.url)+'" target="_blank" rel="noopener">View on site</a></div></div>'});h+='</div>'}
  h+='<p class="meta">Seen: '+esc(d.seen||"")+(d.visible_text&&d.visible_text.length?' · text: '+esc(d.visible_text.join(", ")):'')+'</p>';
  $("out").innerHTML=h;
  [].forEach.call(document.querySelectorAll(".copy"),function(b){b.onclick=function(){var p=b.getAttribute("data-pn");try{navigator.clipboard.writeText(p).then(function(){b.textContent="Copied"})}catch(e){b.textContent=p}}})}
</script></main></body></html>
